<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>সিলেট টেসলা রাইড</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:white;font-family:Arial,"Noto Sans Bengali",sans-serif;overflow:hidden;touch-action:none}
#gameWrap{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#182b22}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.panel{background:#071a17dc;border:1px solid #ffffff38;border-radius:12px;padding:7px 10px;font-size:13px;line-height:1.7;box-shadow:0 3px 10px #0005}
#chargeOuter{width:100px;height:9px;border-radius:10px;background:#555;overflow:hidden;display:inline-block;vertical-align:middle}
#charge{height:100%;width:100%;background:#39e879;transition:width .1s}
#turboOuter{width:95px;height:7px;border-radius:10px;background:#555;overflow:hidden;display:inline-block;vertical-align:middle}
#turboBar{height:100%;width:100%;background:#ffd43b}
#controls{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 16px;gap:8px}
.controlGroup{display:flex;gap:8px;align-items:center}
.ctrl{width:58px;height:58px;border:1px solid #ffffff66;border-radius:18px;background:#071a17cc;color:white;font-size:25px;font-weight:bold;box-shadow:0 4px 0 #0006;touch-action:none;user-select:none}
.ctrl:active,.ctrl.active{background:#147d53;transform:translateY(2px);box-shadow:0 2px 0 #0006}
#turboBtn{width:84px;height:62px;font-size:13px;background:#b54b08e8;border-color:#ffca78}
#turboBtn:disabled{opacity:.65}
#musicBtn{position:absolute;right:10px;top:116px;border:1px solid #ffffff55;background:#071a17dc;color:white;border-radius:10px;padding:8px 10px;font-size:12px}
#overlay{position:absolute;inset:0;background:#07110de8;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
#dialog{max-width:380px;width:100%;background:#132b22;border:1px solid #7de6a2;border-radius:22px;padding:24px 20px;text-align:center;box-shadow:0 12px 40px #0008}
#dialog h1{font-size:27px;margin:0 0 10px;color:#7dffad}
#dialog p{line-height:1.8;font-size:15px}
.mainBtn{border:0;border-radius:14px;background:#28c76f;color:#082014;font-size:17px;font-weight:bold;padding:13px 25px;margin-top:8px}
.small{font-size:12px;color:#c7ddd1}
@media(min-width:700px){.ctrl{width:66px;height:66px}#controls{padding:0 35px;bottom:24px}.panel{font-size:15px}}
</style>
</head>
<body>
<div id="gameWrap">
<canvas id="game"></canvas>

<div id="hud">
  <div class="panel">
    🏁 স্কোর: <b id="score">০</b><br>
    🚗 গতি: <b id="speed">০</b>
  </div>
  <div class="panel">
    🔋 চার্জ: <span id="chargeOuter"><span id="charge"></span></span><br>
    ⚡ খাড়া টান: <span id="turboOuter"><span id="turboBar"></span></span>
    <div id="turboText">প্রস্তুত</div>
  </div>
</div>

<button id="musicBtn">🔊 মিউজিক চালু</button>

<div id="controls">
  <div class="controlGroup">
    <button class="ctrl" id="leftBtn" aria-label="বামে">◀</button>
    <button class="ctrl" id="rightBtn" aria-label="ডানে">▶</button>
  </div>
  <div class="controlGroup">
    <button class="ctrl" id="brakeBtn">▼</button>
    <button class="ctrl" id="accelBtn">▲</button>
    <button class="ctrl" id="turboBtn">⚡<br>খাড়া টান</button>
  </div>
</div>

<div id="overlay">
  <div id="dialog">
    <h1>সিলেট টেসলা রাইড</h1>
    <p>অটো চালাও, খাবার সংগ্রহ করো, চার্জ ধরে রাখো আর রাস্তার গাড়ি এড়িয়ে চলো!</p>
    <p class="small">◀ ▶ দিয়ে দিক পরিবর্তন • ▲ গতি বাড়ায় • ▼ ব্রেক • ⚡ খাড়া টান</p>
    <button class="mainBtn" id="startBtn">গেম শুরু করো</button>
  </div>
</div>
</div>

<audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>

<script>
(() => {
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const $ = id => document.getElementById(id);
const bn = n => Math.max(0,Math.floor(n)).toLocaleString("bn-BD");

let W=0,H=0, running=false, lastTime=0, animationId=0;
let score=0, distance=0, speed=0, charge=100, hits=0;
let playerLane=0, playerX=0, targetX=0, roadOffset=0;
let traffic=[], foods=[], signs=[];
let spawnClock=0, foodClock=0, signClock=0, immunity=0;
let turboFuel=5, turboCooldown=0, turboActive=false;
let keys={left:false,right:false,accel:false,brake:false,turbo:false};
let musicOn=false;
const laneValues=[-0.72,-0.36,0,0.36,0.72];
const colors=["#e84b3c","#e9c941","#52b7ed","#f2f2f2","#a878e8","#f28b35","#46d18b"];
const vehicleTypes=["car","car","car","auto","car"];

function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=Math.floor(W*dpr); canvas.height=Math.floor(H*dpr);
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",resize);
resize();

function roadWidth(y){
  const t=Math.max(0,Math.min(1,(y-H*.16)/(H*.84)));
  return W*(.22+t*.73);
}
function roadCenter(y){return W*.5+Math.sin(roadOffset*.0007)*W*.025}
function laneX(lane,y){
  return roadCenter(y)+lane*roadWidth(y)*.42;
}
function rand(a,b){return a+Math.random()*(b-a)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}

function resetGame(){
  score=0;distance=0;speed=0;charge=100;hits=0;
  playerLane=0;playerX=0;targetX=0;roadOffset=0;
  traffic=[];foods=[];signs=[];
  spawnClock=.5;foodClock=1.5;signClock=1;
  immunity=0;turboFuel=5;turboCooldown=0;turboActive=false;
  keys={left:false,right:false,accel:false,brake:false,turbo:false};
  updateHUD();
}

function startGame(){
  cancelAnimationFrame(animationId);
  resetGame();
  running=true;
  $("overlay").style.display="none";
  lastTime=performance.now();
  const music=$("bgMusic");
  if(musicOn) music.play().catch(()=>{});
  animationId=requestAnimationFrame(loop);
}

function endGame(reason){
  if(!running)return;
  running=false;turboActive=false;
  Object.keys(keys).forEach(k=>keys[k]=false);
  document.querySelectorAll(".ctrl").forEach(b=>b.classList.remove("active"));
  const title=score>=1500?"অসাধারণ চালক! 🏆":
              score>=800?"দারুণ খেলেছ! 🌟":
              score>=350?"বেশ ভালো! 👏":
              score>=100?"ভালো শুরু! 💪":"চেষ্টা চালিয়ে যাও! ❤️";
  let praise=score>=1500
    ?"তুমি সত্যিকারের রাস্তার চ্যাম্পিয়ন! তোমার চালনা ও খাবার সংগ্রহ—দুটিই দুর্দান্ত!"
    :score>=800
    ?"তুমি খুব ভালো খেলেছ! আরেকবার খেললে আরও বড় স্কোর করতে পারবে।"
    :score>=350
    ?"চমৎকার চেষ্টা! গাড়ি এড়িয়ে আর চার্জ বাঁচিয়ে আরও দূর যেতে পারবে।"
    :score>=100
    ?"ভালো শুরু! একটু অনুশীলন করো—পরেরবার নিশ্চয়ই আরও ভালো করবে।"
    :"হাল ছেড়ো না! ধীরে চালাও, খাবার সংগ্রহ করো, আর গাড়ির ফাঁক দেখে এগিয়ে যাও।";
  $("dialog").innerHTML=`
    <h1>${title}</h1>
    <p>${praise}</p>
    <p>🏁 তোমার স্কোর: <b>${bn(score)}</b><br>
    🛣️ অতিক্রান্ত দূরত্ব: <b>${bn(distance)} মিটার</b><br>
    💥 ধাক্কা: <b>${bn(hits)}</b></p>
    <p class="small">${reason}</p>
    <button class="mainBtn" id="restartBtn">আবার খেলো</button>`;
  $("overlay").style.display="flex";
  $("restartBtn").addEventListener("click",startGame);
  updateHUD();
}

function updateHUD(){
  $("score").textContent=bn(score);
  $("speed").textContent=bn(speed);
  $("charge").style.width=Math.max(0,charge)+"%";
  $("charge").style.background=charge<25?"#ff4848":charge<50?"#ffd43b":"#39e879";
  const pct=turboCooldown>0?turboCooldown/5*100:turboFuel/5*100;
  $("turboBar").style.width=Math.max(0,Math.min(100,pct))+"%";
  $("turboBar").style.background=turboCooldown>0?"#aaa":"#ffd43b";
  $("turboText").textContent=turboCooldown>0
    ?"রিফিল: "+turboCooldown.toFixed(1)+" সেকেন্ড"
    :turboActive?"চলছে!":turboFuel<5?"অবশিষ্ট: "+turboFuel.toFixed(1)+" সেকেন্ড":"প্রস্তুত";
}

function moveLane(dir){
  if(!running)return;
  playerLane=Math.max(-2,Math.min(2,playerLane+dir));
}
function bindHold(id,key){
  const el=$(id);
  const down=e=>{e.preventDefault();keys[key]=true;el.classList.add("active");};
  const up=e=>{e.preventDefault();keys[key]=false;el.classList.remove("active");};
  el.addEventListener("pointerdown",down);
  el.addEventListener("pointerup",up);
  el.addEventListener("pointercancel",up);
  el.addEventListener("pointerleave",e=>{if(e.buttons===0)up(e)});
}
$("leftBtn").addEventListener("pointerdown",e=>{e.preventDefault();moveLane(-1)});
$("rightBtn").addEventListener("pointerdown",e=>{e.preventDefault();moveLane(1)});
bindHold("accelBtn","accel");
bindHold("brakeBtn","brake");
bindHold("turboBtn","turbo");

window.addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key))e.preventDefault();
  if(e.repeat && ["ArrowLeft","ArrowRight"].includes(e.key))return;
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")moveLane(-1);
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")moveLane(1);
  if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")keys.accel=true;
  if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")keys.brake=true;
  if(e.key===" "||e.key.toLowerCase()==="shift")keys.turbo=true;
});
window.addEventListener("keyup",e=>{
  if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")keys.accel=false;
  if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")keys.brake=false;
  if(e.key===" "||e.key.toLowerCase()==="shift")keys.turbo=false;
});
window.addEventListener("blur",()=>{
  Object.keys(keys).forEach(k=>keys[k]=false);
});

$("startBtn").addEventListener("click",startGame);
$("musicBtn").addEventListener("click",()=>{
  musicOn=!musicOn;
  const music=$("bgMusic");
  if(musicOn){
    music.play().then(()=>{$("musicBtn").textContent="🔊 মিউজিক বন্ধ"}).catch(()=>{
      musicOn=false;$("musicBtn").textContent="🔇 মিউজিক চালু";
    });
  }else{
    music.pause();$("musicBtn").textContent="🔇 মিউজিক চালু";
  }
});

/* রাস্তা ও দৃশ্য */
function drawBackground(dt){
  const sky=ctx.createLinearGradient(0,0,0,H*.55);
  sky.addColorStop(0,"#75c8f0");sky.addColorStop(1,"#e1f5cf");
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  ctx.fillStyle="#6cb95b";ctx.fillRect(0,H*.27,W,H*.73);
  // দূরের পাহাড়
  ctx.fillStyle="#70a77c";
  ctx.beginPath();ctx.moveTo(0,H*.31);
  for(let x=0;x<=W+30;x+=30)ctx.lineTo(x,H*.23+Math.sin(x*.013+roadOffset*.0003)*H*.035);
  ctx.lineTo(W,H*.42);ctx.lineTo(0,H*.42);ctx.closePath();ctx.fill();

  // রাস্তার বাইরের ঘাসের দাগ
  const stripe=(roadOffset*.25)%90;
  for(let y=-90+stripe;y<H;y+=90){
    ctx.fillStyle="#8bd06b";
    ctx.fillRect(0,y,W,3);
  }

  // রাস্তা
  const top=H*.16,bottom=H+30;
  ctx.fillStyle="#50575c";
  ctx.beginPath();
  ctx.moveTo(roadCenter(top)-roadWidth(top)/2,top);
  ctx.lineTo(roadCenter(top)+roadWidth(top)/2,top);
  ctx.lineTo(roadCenter(bottom)+roadWidth(bottom)/2,bottom);
  ctx.lineTo(roadCenter(bottom)-roadWidth(bottom)/2,bottom);
  ctx.closePath();ctx.fill();

  // রাস্তার কিনারা
  for(let side of [-1,1]){
    ctx.strokeStyle="#f4f1d7";ctx.lineWidth=Math.max(2,W*.006);
    ctx.beginPath();
    ctx.moveTo(roadCenter(top)+side*roadWidth(top)/2,top);
    ctx.lineTo(roadCenter(bottom)+side*roadWidth(bottom)/2,bottom);
    ctx.stroke();
  }

  // লেন ড্যাশ
  const dashOffset=roadOffset%70;
  for(let y=top-70+dashOffset;y<H+60;y+=70){
    const rw=roadWidth(y), c=roadCenter(y);
    for(let lane=-1;lane<=1;lane++){
      const x=c+lane*rw*.21;
      ctx.strokeStyle="#e6e6d5b0";
      ctx.lineWidth=Math.max(1,W*.003);
      ctx.beginPath();
      ctx.moveTo(x,y);ctx.lineTo(x,y+Math.max(12,H*.035));ctx.stroke();
    }
  }

  // রাস্তার পাশের গাছ
  const treeOffset=roadOffset%155;
  for(let y=-155+treeOffset;y<H;y+=155){
    const rw=roadWidth(y),c=roadCenter(y);
    for(let side of [-1,1]){
      const x=c+side*(rw/2+W*.045);
      const size=8+(y/H)*15;
      ctx.fillStyle="#68452c";ctx.fillRect(x-size*.12,y,size*.24,size*.85);
      ctx.fillStyle="#277b43";
      ctx.beginPath();ctx.arc(x,y,size*.55,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(x-size*.3,y+size*.25,size*.4,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(x+size*.3,y+size*.25,size*.4,0,Math.PI*2);ctx.fill();
    }
  }
}

/* সাইনবোর্ড */
const signNames=[
 "শামসুদ্দিন হল ৭ কি.মি.",
 "ওসমানী মেডিকেল ১২ কি.মি.",
 "শাহজালাল মাজার ৮ কি.মি.",
 "রিকাবিবাজার ৬ কি.মি.",
 "পাঁচ ভাই রেস্টুরেন্ট ১১ কি.মি.",
 "পানশি রেস্টুরেন্ট ১৩ কি.মি.",
 "মেহমান রেস্টুরেন্ট ১৫ কি.মি."
];
function spawnSign(){
  signs.push({y:H*.17,name:pick(signNames),side:Math.random()<.5?-1:1});
}
function drawSigns(){
  for(const s of signs){
    const y=s.y, rw=roadWidth(y),c=roadCenter(y);
    const x=c+s.side*(rw/2+W*.055);
    const scale=.35+(y/H)*.85;
    const bw=Math.min(W*.34,150)*scale,bh=25*scale;
    ctx.fillStyle="#5b402a";ctx.fillRect(x-2*scale,y,4*scale,34*scale);
    ctx.fillStyle="#126a40";
    roundRect(x-bw/2,y-bh,bw,bh,4*scale);ctx.fill();
    ctx.strokeStyle="#e7f7cf";ctx.lineWidth=1.5*scale;ctx.stroke();
    ctx.fillStyle="white";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.font=`bold ${Math.max(7,9*scale)}px Arial`;
    ctx.fillText(s.name,x,y-bh/2,bw-5*scale);
  }
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();ctx.roundRect(x,y,w,h,r);
}

/* গাড়ি আঁকা */
function drawVehicle(x,y,scale,type,color,isPlayer=false){
  ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
  // ছায়া
  ctx.fillStyle="#0005";ctx.beginPath();ctx.ellipse(0,5,19,34,0,0,Math.PI*2);ctx.fill();
  if(type==="auto"){
    // অটোর ছাউনি
    ctx.fillStyle="#242a2b";
    roundRect(-14,-24,28,43,5);ctx.fill();
    ctx.fillStyle=isPlayer?"#12bd70":color;
    roundRect(-13,-23,26,39,5);ctx.fill();
    ctx.fillStyle="#bce9ed";
    roundRect(-9,-17,18,12,3);ctx.fill();
    ctx.fillStyle="#222";
    ctx.fillRect(-15,-20,4,10);ctx.fillRect(11,-20,4,10);
    ctx.fillRect(-14,9,4,9);ctx.fillRect(10,9,4,9);
    ctx.fillStyle="#ffeaa0";ctx.fillRect(-10,12,5,3);ctx.fillRect(5,12,5,3);
    ctx.fillStyle="#17252a";ctx.fillRect(-10,-5,20,13);
    ctx.fillStyle="#dffcff";ctx.fillRect(-8,-3,16,8);
  }else{
    ctx.fillStyle="#1c252b";
    roundRect(-13,-31,26,62,7);ctx.fill();
    ctx.fillStyle=color;
    roundRect(-11,-29,22,57,6);ctx.fill();
    ctx.fillStyle="#b9e8f0";
    ctx.beginPath();ctx.moveTo(-8,-21);ctx.lineTo(8,-21);ctx.lineTo(9,-7);ctx.lineTo(-9,-7);ctx.closePath();ctx.fill();
    ctx.fillStyle="#8dc6d4";
    ctx.beginPath();ctx.moveTo(-9,1);ctx.lineTo(9,1);ctx.lineTo(8,13);ctx.lineTo(-8,13);ctx.closePath();ctx.fill();
    ctx.fillStyle="#20272b";
    ctx.fillRect(-15,-19,4,13);ctx.fillRect(11,-19,4,13);
    ctx.fillRect(-15,9,4,13);ctx.fillRect(11,9,4,13);
    ctx.fillStyle="#fff2b1";ctx.fillRect(-9,24,5,3);ctx.fillRect(4,24,5,3);
    ctx.fillStyle="#e74335";ctx.fillRect(-9,-28,5,3);ctx.fillRect(4,-28,5,3);
  }
  if(isPlayer){
    ctx.fillStyle="#fff";ctx.font="bold 7px Arial";ctx.textAlign="center";
    ctx.fillText("RIDE",0,5);
    if(immunity>0){ctx.strokeStyle="#ffec5c";ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,0,21,36,0,0,Math.PI*2);ctx.stroke();}
  }
  ctx.restore();
}

/* খাবার সংগ্রহ */
const foodTypes=[
 {emoji:"🐟",name:"কাশেম মামার আফ্রিকান মাগুর",short:"আফ্রিকান মাগুর"},
 {emoji:"🍗",name:"আপেল মামার মুরগী",short:"মুরগী"},
 {emoji:"🥛",name:"আড়ং UHT Milk",short:"UHT Milk"},
 {emoji:"🥚",name:"আপেল মামার ডিম",short:"ডিম"}
];
function spawnFood(){
  foods.push({lane:pick([-2,-1,0,1,2]),y:H*.18,type:pick(foodTypes),spin:0});
}
function drawFoods(){
  for(const f of foods){
    const x=laneX(laneValues[f.lane+2],f.y);
    const scale=.55+f.y/H*.75;
    ctx.save();ctx.translate(x,f.y);ctx.scale(scale,scale);
    ctx.fillStyle="#1119";ctx.beginPath();ctx.ellipse(0,8,19,9,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#fff6d7";roundRect(-17,-18,34,32,9);ctx.fill();
    ctx.strokeStyle="#efc65b";ctx.lineWidth=2;ctx.stroke();
    ctx.font="21px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(f.type.emoji,0,-2);
    ctx.restore();
  }
}

/* ট্রাফিক: একই লেনে গাড়ির ব্যবধান বজায় রাখা */
function laneHasRoom(lane,minY=H*.28){
  return !traffic.some(v=>v.lane===lane && v.y<minY);
}
function spawnTraffic(){
  // খালি লেন খোঁজা; ভিড় হলে গাড়ি তৈরি হবে না
  const lanes=[-2,-1,0,1,2].sort(()=>Math.random()-.5);
  const lane=lanes.find(l=>laneHasRoom(l,H*.31));
  if(lane===undefined)return;
  const type=pick(vehicleTypes);
  traffic.push({
    lane,y:H*.17,type,
    color:pick(colors),
    speed:rand(.45,.78),
    changeTimer:rand(2,5),
    targetLane:lane,
    wobble:rand(0,6)
  });
}
function drawTraffic(){
  for(const v of traffic){
    const x=laneX(laneValues[v.lane+2],v.y);
    const scale=.42+Math.max(0,v.y/H)*.8;
    drawVehicle(x,v.y,scale,v.type,v.color,false);
  }
}
function updateTraffic(dt,worldSpeed){
  for(let i=traffic.length-1;i>=0;i--){
    const v=traffic[i];
    // আপেক্ষিক গতিতে গাড়ি কাছে আসবে/দূরে যাবে
    v.y+=(worldSpeed*(1.12-v.speed))*dt;
    v.changeTimer-=dt;

    // সামনের গাড়ির খুব কাছে এলে পাশের ফাঁকা লেনে সরে যাবে
    const ahead=traffic.find(o=>o!==v&&o.lane===v.lane&&o.y<v.y&&v.y-o.y<Math.max(75,H*.13));
    if(ahead && v.changeTimer<=0){
      const alternatives=[-2,-1,0,1,2].filter(l=>l!==v.lane&&laneHasRoom(l,H*.45));
      if(alternatives.length){
        v.targetLane=pick(alternatives);
        v.changeTimer=rand(1.2,2.4);
      }else{
        // সামনে আটকে গেলে গতি কমে; গাড়ি এক জায়গায় অনন্তকাল জমে থাকবে না
        v.speed=Math.max(.25,v.speed-.12);
        v.changeTimer=.5;
      }
    }else if(v.changeTimer<=0 && Math.random()<.16){
      const alternatives=[v.lane-1,v.lane+1].filter(l=>l>=-2&&l<=2&&laneHasRoom(l,H*.38));
      if(alternatives.length)v.targetLane=pick(alternatives);
      v.changeTimer=rand(2,4);
    }

    // লেন পরিবর্তন ধীরে ধীরে
    if(v.targetLane!==v.lane && Math.abs(v.targetLane-v.lane)>0){
      v.lane+=Math.sign(v.targetLane-v.lane)*dt*.85;
      if(Math.abs(v.targetLane-v.lane)<.07)v.lane=v.targetLane;
    }

    // সামনে গাড়ি থাকলে দূরত্ব ধরে গতি নিয়ন্ত্রণ
    const front=traffic.find(o=>o!==v&&Math.round(o.lane)===Math.round(v.lane)&&o.y<v.y&&v.y-o.y<85);
    if(front)v.y+=Math.min(12,(85-(v.y-front.y))*.5)*dt;

    if(v.y>H+100)traffic.splice(i,1);
  }

  spawnClock-=dt;
  // প্রতি কয়েক সেকেন্ডে গাড়ি তৈরি, তবে একই লেনে ফাঁক না থাকলে অপেক্ষা
  if(spawnClock<=0){
    spawnTraffic();
    spawnClock=rand(.85,1.55);
  }
}

function update(dt){
  if(!running)return;

  // গতি নিয়ন্ত্রণ
  if(keys.accel)speed+=42*dt;
  else speed-=9*dt;
  if(keys.brake)speed-=58*dt;
  speed=Math.max(0,Math.min(speed,keys.accel?85:65));

  // টার্বো সিস্টেম: ব্যবহার শেষে ৫ সেকেন্ডে সম্পূর্ণ রিফিল
  if(turboCooldown>0){
    turboCooldown=Math.max(0,turboCooldown-dt);
    if(turboCooldown===0)turboFuel=5;
    turboActive=false;
  }else if(keys.turbo && turboFuel>0){
    turboActive=true;
    turboFuel=Math.max(0,turboFuel-dt);
    if(turboFuel===0){
      turboActive=false;
      turboCooldown=5;
      keys.turbo=false;
    }
  }else{
    turboActive=false;
  }

  const worldSpeed=(speed+(turboActive?45:0))*2.1;
  if(turboActive)speed=Math.min(130,85+(5-turboFuel)*9);
  else if(speed>85)speed=85;

  roadOffset+=worldSpeed*dt;
  distance+=worldSpeed*dt*.13;
  score+=Math.floor(worldSpeed*dt*.16);

  // ধীরে ধীরে চার্জ কমে
  charge-=dt*(.45+speed*.009+(turboActive?.9:0));
  if(charge<=0){charge=0;updateHUD();endGame("🔋 চার্জ শেষ হয়ে গেছে!");return;}

  // গাড়ি মসৃণভাবে লেনে যায়
  const laneTarget=laneX(laneValues[playerLane+2],H*.81);
  playerX+=(laneTarget-playerX)*Math.min(1,dt*8);
  targetX=laneTarget;

  immunity=Math.max(0,immunity-dt);

  updateTraffic(dt,worldSpeed);

  foodClock-=dt;
  if(foodClock<=0){spawnFood();foodClock=rand(2.5,4.2);}
  signClock-=dt;
  if(signClock<=0){spawnSign();signClock=rand(3.5,5.5);}

  // খাবার ও সাইনবোর্ড এগিয়ে আসা
  foods.forEach(f=>f.y+=worldSpeed*dt);
  signs.forEach(s=>s.y+=worldSpeed*dt*.85);
  foods=foods.filter(f=>f.y<H+60);
  signs=signs.filter(s=>s.y<H+100);

  // খাবার সংগ্রহ
  for(let i=foods.length-1;i>=0;i--){
    const f=foods[i], fx=laneX(laneValues[f.lane+2],f.y);
    if(Math.abs(f.y-H*.81)<38 && Math.abs(fx-playerX)<Math.max(24,W*.045)){
      score+=100;charge=Math.min(100,charge+24);
      foods.splice(i,1);
    }
  }

  // সংঘর্ষ শনাক্তকরণ
  if(immunity<=0){
    for(const v of traffic){
      const vx=laneX(laneValues[Math.max(0,Math.min(4,Math.round(v.lane)+2))],v.y);
      if(Math.abs(v.y-H*.81)<45 && Math.abs(vx-playerX)<W*.055){
        hits++;charge=Math.max(0,charge-14);speed=Math.max(0,speed-25);immunity=1.15;
        if(hits>=3){updateHUD();endGame("💥 তিনবার ধাক্কা লেগেছে!");return;}
        break;
      }
    }
  }

  updateHUD();
}

function drawPlayer(){
  const y=H*.81;
  const scale=Math.min(1.2,Math.max(.72,H/650));
  drawVehicle(playerX,y,scale,"auto","#12bd70",true);
}

function draw(){
  drawBackground();
  drawSigns();
  drawFoods();
  drawTraffic();
  drawPlayer();

  if(turboActive){
    ctx.save();
    ctx.strokeStyle="#ffd43b";
    ctx.lineWidth=3;
    ctx.globalAlpha=.7;
    for(let i=0;i<8;i++){
      const x=playerX+rand(-20,20),y=H*.84+rand(0,40);
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+rand(-5,5),y+rand(10,25));ctx.stroke();
    }
    ctx.restore();
  }

  if(immunity>0 && running){
    ctx.fillStyle="#ffffff10";ctx.fillRect(0,0,W,H);
  }
}

function loop(now){
  if(!running)return;
  const dt=Math.min(.04,(now-lastTime)/1000||0);
  lastTime=now;
  update(dt);
  draw();
  if(running)animationId=requestAnimationFrame(loop);
}
draw();
})();
</script>
