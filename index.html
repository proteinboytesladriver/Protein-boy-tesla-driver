
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>সিলেট টেসলা রাইড</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:white;font-family:Arial,"Noto Sans Bengali",sans-serif;overflow:hidden;touch-action:none}
#gameWrap{position:relative;width:100vw;height:100dvh;max-width:600px;margin:auto;background:#39874b;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;z-index:2;pointer-events:none}
.panel{background:#101820dc;padding:7px 10px;border-radius:10px;font-size:13px;font-weight:bold}
#chargeOuter{width:90px;height:10px;background:#555;border-radius:8px;display:inline-block;overflow:hidden;vertical-align:middle}
#chargeBar{height:100%;width:100%;background:#35e879;transition:width .1s}
#turboOuter{width:80px;height:7px;background:#555;border-radius:8px;overflow:hidden;margin-top:4px}
#turboBar{height:100%;width:100%;background:#ffc928}
#buttons{position:absolute;bottom:15px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 13px;z-index:3}
.group{display:flex;gap:8px;align-items:end}
.ctrl{width:60px;height:60px;border:2px solid #ffffff70;border-radius:18px;background:#17212de8;color:white;font-size:25px;font-weight:bold;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none}
.ctrl:active{background:#3679ad}
.ctrl.small{width:54px;height:54px;font-size:16px}
#turboBtn{width:76px;height:62px;background:#b95112;font-size:13px;line-height:1.25}
#turboBtn.ready{background:#dc6417}
#turboBtn.cool{background:#444}
#overlay{position:absolute;inset:0;background:#07111be8;display:flex;align-items:center;justify-content:center;z-index:5;padding:22px}
#dialog{width:100%;max-width:360px;background:#172735;border:1px solid #ffffff35;border-radius:22px;padding:24px 18px;text-align:center;box-shadow:0 10px 35px #0008}
#dialog h1{margin:0 0 12px;font-size:27px}
#dialog p{line-height:1.7;margin:8px 0 18px}
.mainBtn{border:0;border-radius:12px;padding:13px 20px;background:#20a568;color:white;font-size:17px;font-weight:bold;width:100%;margin-top:8px}
#musicBtn{position:absolute;right:10px;top:68px;z-index:3;border:0;border-radius:10px;padding:8px;background:#101820d9;color:white}
.note{font-size:12px;color:#d4e4ee}
</style>
</head>
<body>
<div id="gameWrap">
<canvas id="game"></canvas>

<div id="hud">
  <div class="panel">স্কোর: <span id="score">০</span></div>
  <div class="panel">গতি: <span id="speed">০</span></div>
  <div class="panel">চার্জ: <span id="chargeOuter"><span id="chargeBar"></span></span></div>
  <div class="panel">ধাক্কা: <span id="hits">০</span>/৩</div>
  <div class="panel" style="min-width:115px">
    <span id="turboText">খাড়া টান: প্রস্তুত</span>
    <div id="turboOuter"><div id="turboBar"></div></div>
  </div>
</div>

<button id="musicBtn">🔊 গান</button>

<div id="buttons">
  <div class="group">
    <button class="ctrl" id="leftBtn">◀</button>
    <button class="ctrl" id="rightBtn">▶</button>
  </div>
  <div class="group">
    <button class="ctrl small" id="brakeBtn">ব্রেক</button>
    <button class="ctrl" id="accelBtn">▲</button>
    <button class="ctrl" id="turboBtn">⚡<br>খাড়া টান</button>
  </div>
</div>

<div id="overlay">
  <div id="dialog">
    <h1>🛺 সিলেট টেসলা রাইড</h1>
    <p>সাবধানে গাড়ি চালাও, রাস্তার খাবার সংগ্রহ করো এবং চার্জ ধরে রাখো!</p>
    <p class="note">খাড়া টান: ৫ সেকেন্ড ব্যবহার + ৫ সেকেন্ড রিফিল</p>
    <button class="mainBtn" id="startBtn">গেম শুরু করো</button>
  </div>
</div>

<audio id="music" src="music.mp3" loop preload="auto"></audio>
</div>

<script>
(() => {
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const $ = id => document.getElementById(id);

let W=0,H=0,dpr=1;
function resize(){
  const rect=canvas.getBoundingClientRect();
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=rect.width; H=rect.height;
  canvas.width=Math.round(W*dpr);
  canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",resize);
resize();

const lanes=[-.72,-.36,0,.36,.72];
const foods=[
  {name:"কাশেম মামার আফ্রিকান মাগুর",emoji:"🐟",short:"আফ্রিকান মাগুর"},
  {name:"আপেল মামার মুরগী",emoji:"🍗",short:"মুরগী"},
  {name:"আড়ং UHT Milk",emoji:"🥛",short:"UHT Milk"},
  {name:"আপেল মামার ডিম",emoji:"🥚",short:"ডিম"}
];
const signNames=[
  "শামসুদ্দিন হল ৭ কি.মি.",
  "ওসমানী মেডিকেল ১২ কি.মি.",
  "শাহজালাল মাজার ৮ কি.মি.",
  "রিকাবিবাজার ৬ কি.মি.",
  "পাঁচ ভাই রেস্টুরেন্ট ১১ কি.মি.",
  "পানশি রেস্টুরেন্ট ১৩ কি.মি.",
  "মেহমান রেস্টুরেন্ট ১৫ কি.মি."
];

let running=false,score=0,charge=100,hits=0,speed=0;
let playerLane=2,playerX=0,playerTargetX=0;
let roadOffset=0,worldTime=0,lastTime=0;
let traffic=[],pickups=[],signs=[];
let invulnerableUntil=0;
let turboUntil=0,turboCooldownUntil=0;
let turboReady=true;
let lastPickup=0,lastTrafficSpawn=0,lastSignSpawn=0;
let keys={left:false,right:false,accel:false,brake:false};
let animationId=0;

const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const rand=(a,b)=>a+Math.random()*(b-a);
const choose=a=>a[Math.floor(Math.random()*a.length)];
const bn=n=>Math.floor(n).toLocaleString("bn-BD");

function roadWidth(){return Math.min(W*.78,430)}
function roadLeft(){return (W-roadWidth())/2}
function laneX(lane){return W/2+lane*roadWidth()*.47}
function playerY(){return H*.78}
function carWidth(){return Math.max(29,roadWidth()*.105)}

function resetGame(){
  score=0;charge=100;hits=0;speed=0;
  playerLane=2;playerX=0;playerTargetX=0;
  roadOffset=0;worldTime=0;
  invulnerableUntil=0;
  turboUntil=0;turboCooldownUntil=0;turboReady=true;
  lastPickup=0;lastTrafficSpawn=0;lastSignSpawn=0;
  traffic=[];pickups=[];signs=[];
  for(let i=0;i<4;i++){
    signs.push({side:i%2?1:-1,y:-i*H*.45-100,text:choose(signNames)});
  }
  for(let i=0;i<3;i++){
    spawnTraffic(-i*H*.4-180);
  }
  updateHud();
}

function startGame(){
  cancelAnimationFrame(animationId);
  resetGame();
  running=true;
  $("overlay").style.display="none";
  lastTime=performance.now();
  const music=$("music");
  music.play().catch(()=>{});
  animationId=requestAnimationFrame(loop);
}

function spawnTraffic(y=-100){
  const lane=Math.floor(Math.random()*lanes.length);
  const type=Math.random()<.36?"auto":"car";
  traffic.push({
    lane,x:laneX(lanes[lane]),y,
    type,
    color:choose(["#e74c3c","#f4c542","#35a7e8","#e8e8e8","#8e68ce","#f08c45","#2ecc71"]),
    factor:rand(.62,1.12),
    sway:rand(0,Math.PI*2),
    swayRate:rand(.4,1.1),
    passed:false,
    nearMiss:false
  });
}

function spawnPickup(){
  const lane=Math.floor(Math.random()*lanes.length);
  pickups.push({
    lane,x:laneX(lanes[lane]),y:-50,
    food:choose(foods),
    spin:rand(0,6)
  });
}

function spawnSign(){
  signs.push({
    side:Math.random()<.5?-1:1,
    y:-80,
    text:choose(signNames)
  });
}

function activateTurbo(){
  const now=performance.now();
  if(!running)return;
  if(now<turboUntil)return;
  if(now<turboCooldownUntil)return;
  turboUntil=now+5000;
  turboCooldownUntil=turboUntil+5000;
  turboReady=false;
  updateHud();
}

function updateTurbo(now){
  if(turboUntil && now>=turboUntil){
    turboUntil=0;
  }
  if(!turboUntil && !turboReady && now>=turboCooldownUntil){
    turboReady=true;
    turboCooldownUntil=0;
  }
}

function updateHud(){
  $("score").textContent=bn(score);
  $("speed").textContent=bn(Math.round(speed));
  $("chargeBar").style.width=clamp(charge,0,100)+"%";
  $("chargeBar").style.background=charge<25?"#ff4545":charge<50?"#ffc928":"#35e879";
  $("hits").textContent=bn(hits);

  const now=performance.now();
  const active=now<turboUntil;
  const remaining=active?turboUntil-now:turboReady?5000:Math.max(0,turboCooldownUntil-now);
  $("turboBar").style.width=(active?remaining/5000*100:turboReady?100:(1-remaining/5000)*100)+"%";
  $("turboText").textContent=active?"খাড়া টান: চালু":turboReady?"খাড়া টান: প্রস্তুত":"রিফিল: "+bn(Math.ceil(remaining/1000))+" সে.";
  $("turboBtn").classList.toggle("ready",turboReady);
  $("turboBtn").classList.toggle("cool",!turboReady);
}

function roundedRect(x,y,w,h,r,fill,stroke){
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
  if(fill){ctx.fillStyle=fill;ctx.fill()}
  if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}
}

function drawCar(x,y,w,h,color,type="car",isPlayer=false){
  ctx.save();
  ctx.translate(x,y);
  // ছায়া
  ctx.fillStyle="#0004";
  ctx.beginPath();ctx.ellipse(2,h*.12,w*.62,h*.54,0,0,Math.PI*2);ctx.fill();

  if(type==="auto"){
    // অটোর চাকা
    ctx.fillStyle="#202329";
    roundedRect(-w*.52,-h*.25,w*.18,h*.34,4,"#202329");
    roundedRect(w*.34,-h*.25,w*.18,h*.34,4,"#202329");
    roundedRect(-w*.52,h*.25,w*.18,h*.34,4,"#202329");
    roundedRect(w*.34,h*.25,w*.18,h*.34,4,"#202329");
    // অটোর বডি
    roundedRect(-w*.42,-h*.49,w*.84,h*.98,7,color);
    roundedRect(-w*.32,-h*.34,w*.64,h*.38,4,"#a7e7ee");
    roundedRect(-w*.32,h*.12,w*.64,h*.23,3,"#f7d85d");
    ctx.fillStyle="#202329";
    ctx.fillRect(-w*.3,-h*.02,w*.6,2);
  }else{
    roundedRect(-w*.47,-h*.5,w*.94,h,8,"#25282b");
    roundedRect(-w*.4,-h*.48,w*.8,h*.96,7,color);
    roundedRect(-w*.32,-h*.31,w*.64,h*.27,4,"#a8e4f4");
    roundedRect(-w*.32,h*.07,w*.64,h*.23,4,"#9ad8e9");
    ctx.fillStyle="#fff2bb";
    ctx.fillRect(-w*.32,-h*.47,w*.17,4);
    ctx.fillRect(w*.15,-h*.47,w*.17,4);
  }
  // পেছনের লাইট
  ctx.fillStyle="#ff3b30";
  ctx.fillRect(-w*.34,h*.39,w*.2,3);
  ctx.fillRect(w*.14,h*.39,w*.2,3);

  if(isPlayer){
    ctx.fillStyle="#111";
    ctx.font="bold "+Math.max(9,w*.22)+"px Arial";
    ctx.textAlign="center";
    ctx.fillText("EV",0,h*.17);
  }
  ctx.restore();
}

function drawRoad(dt){
  // ঘাস
  ctx.fillStyle="#39874b";ctx.fillRect(0,0,W,H);

  // রাস্তার পাশের ঝোপ/গাছ
  for(let y=-80+(roadOffset%150);y<H+80;y+=150){
    for(const side of [-1,1]){
      const x=W/2+side*(roadWidth()*.5+randStable(y,side)*W*.1+20);
      ctx.fillStyle="#245e38";
      ctx.beginPath();ctx.arc(x,y,13,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#4b9d54";
      ctx.beginPath();ctx.arc(x-4,y-5,10,0,Math.PI*2);ctx.fill();
    }
  }

  // রাস্তা
  const left=roadLeft(),rw=roadWidth();
  ctx.fillStyle="#555b61";ctx.fillRect(left,0,rw,H);

  // রাস্তার কিনারার সাদা লাইন
  ctx.fillStyle="#f4f0d6";
  ctx.fillRect(left+3,0,3,H);ctx.fillRect(left+rw-6,0,3,H);

  // লেন মার্কিং
  ctx.fillStyle="#e7e6d9";
  const dash=48,gap=35,offset=roadOffset%(dash+gap);
  for(let lane=1;lane<5;lane++){
    const x=left+rw*lane/5;
    for(let y=-dash+offset;y<H;y+=dash+gap){
      ctx.fillRect(x-1.5,y,3,dash);
    }
  }
}
function randStable(y,side){
  return (Math.abs(Math.floor(y/150)*37+side*19)%100)/100;
}

function drawSigns(){
  for(const s of signs){
    const x=W/2+s.side*(roadWidth()*.5+46);
    ctx.save();
    ctx.translate(x,s.y);
    ctx.fillStyle="#4a3322";ctx.fillRect(-3,5,6,42);
    roundedRect(-55,-24,110,32,5,"#fff3b0","#6a4b20");
    ctx.fillStyle="#193c29";
    ctx.font="bold 10px Arial";
    ctx.textAlign="center";
    ctx.fillText(s.text,0,-4,104);
    ctx.restore();
  }
}

function drawPickups(){
  for(const p of pickups){
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(Math.sin(p.spin)*.07);
    ctx.fillStyle="#0005";
    ctx.beginPath();ctx.ellipse(0,13,17,6,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#fff";
    ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#ffc928";ctx.lineWidth=3;ctx.stroke();
    ctx.font="22px Arial";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(p.food.emoji,0,1);
    ctx.restore();
  }
}

function drawTraffic(){
  for(const t of traffic){
    drawCar(t.x,t.y,carWidth()*.86,carWidth()*1.65,t.color,t.type,false);
  }
}

function drawPlayer(now){
  const w=carWidth()*1.1,h=w*1.72;
  if(now<invulnerableUntil && Math.floor(now/100)%2===0)return;
  drawCar(W/2+playerX*roadWidth()*.47,playerY(),w,h,"#14a8ee","car",true);
}

function update(dt,now){
  updateTurbo(now);
  const turbo=now<turboUntil;
  const maxSpeed=turbo?130:85;
  if(keys.accel)speed+=65*dt;
  else speed-=18*dt;
  if(keys.brake)speed-=90*dt;
  speed=clamp(speed,0,maxSpeed);

  if(charge<=0){endGame("চার্জ শেষ হয়ে গেছে!");return}
  if(speed>0)charge-=dt*(.35+speed*.007);
  charge=clamp(charge,0,100);

  const moveSpeed=(55+speed*1.7)*(turbo?1.45:1);
  roadOffset+=moveSpeed*dt;
  worldTime+=dt;

  // লেনের লক্ষ্য ধীরে অনুসরণ করে
  if(keys.left)playerLane=Math.max(0,playerLane-1);
  if(keys.right)playerLane=Math.min(4,playerLane+1);
  // একবার চাপলে এক লেন, ধরে রাখলেও ক্রমাগত লেন বদলাবে না
  playerTargetX=lanes[playerLane];
  playerX+=(playerTargetX-playerX)*Math.min(1,dt*9);

  // সাইনবোর্ড সবসময় গতিশীল
  for(const s of signs)s.y+=moveSpeed*dt;
  signs=signs.filter(s=>s.y<H+80);
  if(now-lastSignSpawn>1600){
    spawnSign();lastSignSpawn=now;
  }

  // ট্রাফিক: সব গাড়ির y প্রতি ফ্রেমে বাড়ে, তাই আটকে থাকে না
  for(const t of traffic){
    const relativeSpeed=moveSpeed*(1.05-t.factor*.25);
    t.y+=relativeSpeed*dt;
    t.sway+=dt*t.swayRate;
    const sway=Math.sin(t.sway)*roadWidth()*.008;
    t.x=laneX(lanes[t.lane])+sway;

    if(!t.passed && t.y>playerY()+carWidth()){
      t.passed=true;
      score+=2;
    }

    const dx=Math.abs((W/2+playerX*roadWidth()*.47)-t.x);
    const dy=Math.abs(playerY()-t.y);
    if(dx<carWidth()*.78 && dy<carWidth()*1.15 && now>invulnerableUntil){
      hits++;
      charge=Math.max(0,charge-12);
      invulnerableUntil=now+1100;
      speed=Math.max(10,speed*.48);
      t.y=H+200;
      if(hits>=3){endGame("তিনবার ধাক্কা লেগেছে!");return}
    }else if(!t.nearMiss && !t.passed && dy<carWidth()*.8 && dx<carWidth()*1.5){
      t.nearMiss=true;
      score+=1;
    }
  }

  // পুরোনো গাড়ি সরিয়ে নতুন গাড়ি আনা
  traffic=traffic.filter(t=>t.y<H+carWidth()*3);
  if(now-lastTrafficSpawn>Math.max(430,1050-speed*4)){
    if(traffic.length<8)spawnTraffic(-carWidth()*2);
    lastTrafficSpawn=now;
  }
  // ফাঁকা রাস্তা হলে গাড়ি যোগ করো
  if(traffic.length<3 && Math.random()<dt*.7)spawnTraffic(-100);

  // খাবার
  for(const p of pickups){
    p.y+=moveSpeed*dt;
    p.spin+=dt*3;
    const px=W/2+playerX*roadWidth()*.47;
    if(Math.abs(px-p.x)<carWidth()*.9 && Math.abs(playerY()-p.y)<carWidth()*1.1){
      score+=10;
      charge=Math.min(100,charge+25);
      p.y=H+200;
      showPickup(p.food);
    }
  }
  pickups=pickups.filter(p=>p.y<H+60);
  if(now-lastPickup>2300){
    if(pickups.length<3)spawnPickup();
    lastPickup=now;
  }

  updateHud();
}

let pickupMessage="",pickupMessageUntil=0;
function showPickup(food){
  pickupMessage="+"+food.short+"  •  চার্জ বেড়েছে!";
  pickupMessageUntil=performance.now()+1300;
}

function drawMessage(now){
  if(now<pickupMessageUntil){
    ctx.save();
    ctx.font="bold 17px Arial";
    ctx.textAlign="center";
    const text=pickupMessage;
    roundedRect(W/2-145,H*.2-19,290,38,12,"#0b1725dd");
    ctx.fillStyle="#fff";
    ctx.fillText(text,W/2,H*.2+6,275);
    ctx.restore();
  }
  if(now<turboUntil){
    ctx.save();
    ctx.fillStyle="#ffdb55";
    ctx.font="bold 20px Arial";
    ctx.textAlign="center";
    ctx.fillText("⚡ খাড়া টান!",W/2,H*.3);
    ctx.restore();
  }
}

function draw(now){
  drawRoad();
  drawSigns();
  drawPickups();
  drawTraffic();
  drawPlayer(now);
  drawMessage(now);
}

function loop(now){
  if(!running)return;
  const dt=clamp((now-lastTime)/1000,0,.04);
  lastTime=now;
  update(dt,now);
  draw(now);
  if(running)animationId=requestAnimationFrame(loop);
}

function praiseForScore(s){
  if(s>=500)return ["🏆 অসাধারণ ড্রাইভিং!","তুমি তো সিলেটের রাস্তার কিংবদন্তি! এত বড় স্কোর সত্যিই দারুণ!"];
  if(s>=300)return ["🌟 দুর্দান্ত!","তোমার ড্রাইভিং দক্ষতা অসাধারণ। আরেকবার খেললে নতুন রেকর্ড হতে পারে!"];
  if(s>=150)return ["👏 বেশ ভালো খেলেছ!","তুমি ভালোই এগিয়েছিলে। এবার আরও সাবধানে চালিয়ে স্কোর বাড়াও!"];
  if(s>=60)return ["👍 ভালো চেষ্টা!","শুরুটা ভালো হয়েছে। খাবার সংগ্রহ করো, চার্জ বাঁচাও—পরেরবার আরও ভালো করবে!"];
  return ["🙂 আবার চেষ্টা করো!","প্রতিটি চেষ্টাতেই দক্ষতা বাড়ে। এবার ধীরে চালাও এবং খাবার সংগ্রহ করতে ভুলো না!"];
}

function endGame(reason){
  if(!running)return;
  running=false;
  cancelAnimationFrame(animationId);
  const [title,message]=praiseForScore(score);
  $("overlay").style.display="flex";
  $("dialog").innerHTML=
    "<h1>গেম ওভার</h1>"+
    "<p>"+reason+"</p>"+
    "<h2>"+title+"</h2>"+
    "<p>তোমার স্কোর: <strong>"+bn(score)+"</strong></p>"+
    "<p>"+message+"</p>"+
    '<button class="mainBtn" id="restartBtn">আবার খেলো</button>'+
    '<p class="note">সেরা স্কোর: '+bn(saveBest(score))+'</p>';
  $("restartBtn").addEventListener("click",startGame);
}

function saveBest(s){
  // স্থানীয় স্টোরেজের ওপর নির্ভর না করে এই সেশনের রেকর্ড
  bestScore=Math.max(bestScore,s);
  return bestScore;
}
let bestScore=0;

// বোতাম ধরে রাখার ইনপুট
function holdButton(id,key){
  const el=$(id);
  const down=e=>{
    e.preventDefault();
    keys[key]=true;
  };
  const up=e=>{
    e.preventDefault();
    keys[key]=false;
  };
  el.addEventListener("pointerdown",down);
  el.addEventListener("pointerup",up);
  el.addEventListener("pointercancel",up);
  el.addEventListener("pointerleave",up);
}
holdButton("leftBtn","left");
holdButton("rightBtn","right");
holdButton("accelBtn","accel");
holdButton("brakeBtn","brake");

// লেন বাটনে একবার চাপলে একবারই লেন পরিবর্তন
$("leftBtn").addEventListener("pointerdown",e=>{
  e.preventDefault();
  if(running)playerLane=Math.max(0,playerLane-1);
});
$("rightBtn").addEventListener("pointerdown",e=>{
  e.preventDefault();
  if(running)playerLane=Math.min(4,playerLane+1);
});
// hold handlers-এর পুনরাবৃত্ত লেন পরিবর্তন বন্ধ
keys.left=false;keys.right=false;

$("turboBtn").addEventListener("pointerdown",e=>{
  e.preventDefault();
  activateTurbo();
});
$("startBtn").addEventListener("click",startGame);

$("musicBtn").addEventListener("click",()=>{
  const m=$("music");
  if(m.paused){
    m.play().then(()=>{$("musicBtn").textContent="🔊 গান"}).catch(()=>{});
  }else{
    m.pause();
    $("musicBtn").textContent="🔇 গান";
  }
});

// কিবোর্ড কন্ট্রোল
window.addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key))e.preventDefault();
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a"){
    if(!keys.left && running)playerLane=Math.max(0,playerLane-1);
    keys.left=true;
  }
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d"){
    if(!keys.right && running)playerLane=Math.min(4,playerLane+1);
    keys.right=true;
  }
  if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")keys.accel=true;
  if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")keys.brake=true;
  if((e.key===" "||e.key.toLowerCase()==="x")&&!e.repeat)activateTurbo();
});
window.addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")keys.left=false;
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")keys.right=false;
  if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")keys.accel=false;
  if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")keys.brake=false;
});
window.addEventListener("blur",()=>{
  keys={left:false,right:false,accel:false,brake:false};
});

draw(performance.now());
})();
</script>
</body>
</html>
